name: Bug report
description: Something is broken on the live site or in this code
title: "fix: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Which page or route
      placeholder: "/projects or /stats"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Safari on iPhone"
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
