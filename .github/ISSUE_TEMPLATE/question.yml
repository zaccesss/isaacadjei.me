name: Question about the code
description: Ask how something in this repository works
title: "question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File or folder it relates to
      placeholder: "components/layout/PublicShell.tsx"
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
