# lints, type checks, tests and builds the site on every push to main and every pull request targeting main. The build
# runs with no service keys, so it also proves the site still renders its empty states.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least privilege token: read only access to the repository contents
permissions:
  contents: read

jobs:
  build:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    # retry package downloads so one dropped connection does not fail the run
    env:
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
