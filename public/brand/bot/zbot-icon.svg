<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root { --tile: #05070D; --dot: #5778DB; }
    @media (prefers-color-scheme: dark) { :root { --tile: #FAFAFA; --dot: #2445A8; } }
  </style>
  <defs>
    <mask id="zbot-knock">
      <rect x="8" y="8" width="84" height="84" rx="20" fill="#FFFFFF"/>
      <!-- eyes and mouth are true holes cut through the tile, matching the "ia" mark's knockout technique -->
      <circle cx="41" cy="49" r="5.5" fill="#000000"/>
      <circle cx="59" cy="49" r="5.5" fill="#000000"/>
      <rect x="40" y="60" width="20" height="5" rx="2.5" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#zbot-knock)">
    <rect x="8" y="8" width="84" height="84" rx="20" fill="var(--tile)"/>
    <line x1="50" y1="20" x2="50" y2="28" stroke="var(--dot)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="17" r="4.5" fill="var(--dot)"/>
    <rect x="28" y="30" width="44" height="38" rx="12" fill="var(--dot)"/>
    <rect x="21" y="42" width="7" height="14" rx="3.5" fill="var(--dot)"/>
    <rect x="72" y="42" width="7" height="14" rx="3.5" fill="var(--dot)"/>
  </g>
</svg>
