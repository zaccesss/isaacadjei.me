<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 2.25 76 76">
  <!-- the bot alone, like the ia email mark. The eyes and mouth are cut out, so they show the mail background:
       light in light mode, dark in dark mode. A thin white outline keeps the head readable on dark backgrounds -->
  <defs>
    <mask id="face" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
      <circle cx="41" cy="49" r="5.5" fill="#000000"/>
      <circle cx="59" cy="49" r="5.5" fill="#000000"/>
      <rect x="40" y="60" width="20" height="5" rx="2.5" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#face)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
      <line x1="50" y1="20" x2="50" y2="28" stroke-width="7" stroke-linecap="round"/>
      <circle cx="50" cy="17" r="4.5"/>
      <rect x="28" y="30" width="44" height="38" rx="12"/>
      <rect x="21" y="42" width="7" height="14" rx="3.5"/>
      <rect x="72" y="42" width="7" height="14" rx="3.5"/>
    </g>
    <line x1="50" y1="20" x2="50" y2="28" stroke="#5778DB" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="17" r="4.5" fill="#5778DB"/>
    <rect x="28" y="30" width="44" height="38" rx="12" fill="#5778DB"/>
    <rect x="21" y="42" width="7" height="14" rx="3.5" fill="#5778DB"/>
    <rect x="72" y="42" width="7" height="14" rx="3.5" fill="#5778DB"/>
  </g>
</svg>
